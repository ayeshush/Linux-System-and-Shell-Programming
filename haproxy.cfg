global
    # Use the system-wide log facility
    log /dev/log    local0
    # Process management and user
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    # Maximum connections
    maxconn 2000

defaults
    # Log format and logging options
    log global
    mode tcp
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    # Option to check server status before sending data
    option tcp-check

# -----------------
# FRONTEND
# -----------------
frontend ft_tcp_balancer
    # Listen on port 80 (HTTP) on all available IPs
    bind *:80
    # Default backend for all connections
    default_backend bk_webservers

# -----------------
# BACKEND
# -----------------
backend bk_webservers
    # Load balancing algorithm: Round Robin
    balance roundrobin
    # Configure the health check
    # Check: Perform a TCP check every 2 seconds
    # Fall: After 3 consecutive failed checks, mark the server as DOWN
    # Inter: The delay between checks (2000ms = 2s)
    # Rise: After 2 consecutive successful checks, mark the server as UP
    option tcp-check
    tcp-check connect port 80 check inter 2000ms fall 3 rise 2

    # Backend Server Pool (Note: Replace 127.0.0.1 with the actual local IP if using a multi-VM setup)
    server web01 127.0.0.1:8081 check
    server web02 127.0.0.1:8082 check
